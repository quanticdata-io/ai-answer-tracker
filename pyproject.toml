[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-answer-tracker"
version = "0.1.0"
description = "Track whether AI assistants cite or mention your site for a list of questions, run after run, with SQLite history, share of voice and CSV/JSON export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "tomli>=2.0; python_version < '3.11'"]
keywords = ["ai-visibility", "llm", "generative-engine-optimization", "ai-overview", "citations", "seo", "quanticdata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.scripts]
ai-answer-tracker = "ai_answer_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/quanticdata-io/ai-answer-tracker"
Documentation = "https://github.com/quanticdata-io/ai-answer-tracker#readme"
Issues = "https://github.com/quanticdata-io/ai-answer-tracker/issues"
Changelog = "https://github.com/quanticdata-io/ai-answer-tracker/blob/main/CHANGELOG.md"
"API reference" = "https://quanticdata.io/docs/"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_answer_tracker"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
